<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header class="header" id="header">

        <div class="header_div_container">

            <!-- Nav Buttons  -->
            <div class="cpp_container">

                <a href="#goals">Goals</a>
                <a href="#productivity">Productivity</a>
                <a href="#progress">Progress</a>

            </div>

            <!-- Title Badge  -->
            <div class="title_container">

                <h1>
                    <span>Track-</span><span>You-</span><span>Up</span>
                </h1>

            </div>

            <!-- Logina & Theme buttons -->
            <div class="login_container">

                <button id="theme-toggle" title="Dark Mode">
                    <i data-lucide="moon"></i>
                </button>

                <button>
                    Login
                </button>

            </div>

        </div>

    </header>

    <main>

        <div class="main-container">

            <!-- Goals Card  -->
            <div class="goals">

                <h2>Today's Goals</h2>

                <p id="empty-msg" class="empty-msg">
                    No Goal Added Yet - Click "Add Task" to Add
                </p>

                <ul class="task-list">

                    <!-- Tasks will be rendered here dynamically using JS -->

                </ul>

                <div class="task-controls">

                    <button id="add-task-btn">
                        <i data-lucide="plus"></i>
                        Add Task
                    </button>

                    <button id="edit-task-mode-btn">
                        <i data-lucide="pen-line"></i>
                        Edit
                    </button>

                </div>

            </div>

            <div class="productivity">

                <!-- Header -->
                <div class="productivity-header">

                    <h2>Productivity - Today</h2>

                </div>


                <!-- Progress Ring -->
                <div class="productivity-ring">

                    <svg class="progress-ring" width="160" height="160">

                        <circle class="ring-track" cx="80" cy="80" r="70" />

                        <circle class="ring-progress" cx="80" cy="80" r="70" />

                    </svg>

                    <div class="progress-percentage">

                        <span id="productivity-percent">
                            0%
                        </span>

                    </div>

                </div>


                <!-- 2 × 2 Grid Section -->
                <div class="productivity-stats-grid">

                    <!-- Cell 1 — Completed -->
                    <div class="grid-cell completed-cell">

                        <span class="stat-label">
                            Completed :
                        </span>

                        <span class="stat-number" id="completed-count">
                            0
                        </span>

                    </div>


                    <!-- Cell 2 — Time Bar -->
                    <div class="grid-cell time-bar-cell">

                        <div class="time-bar" id="time-bar">

                            <!-- Stamps will be inserted dynamically -->

                            <!-- Example -->

                            <div class="time-stamp" style="left: 45%;" title="Finish assignment - 6:10 PM"></div>


                        </div>

                    </div>


                    <!-- Cell 3 — Remaining -->
                    <div class="grid-cell remaining-cell">

                        <span class="stat-label">
                            Remaining :
                        </span>

                        <span class="stat-number" id="remaining-count">
                            0
                        </span>

                    </div>


                    <!-- Cell 4 — Status -->
                    <div class="grid-cell status-cell">

                        <span class="productivity-status stat-label" id="productivity-status-label">
                            Status :
                        </span>

                        <span class="productivity-status stat-number" id="productivity-status-value">
                            Starting
                        </span>

                    </div>

                </div>


                <!-- Quote -->
                <div class="productivity-quote-container">

                    <span class="productivity-quote" id="productivity-quote">
                        Stay consistent.
                    </span>

                </div>

            </div>

            <div class="progress">
                <h2>Progress Over Time</h2>
            </div>

        </div>

    </main>

    <!-- Add Task Form  -->
    <div id="task-modal" class="modal">

        <div class="modal-content">

            <h2>Add New Goal</h2>

            <form id="task-form">
                <div class="form-field">

                    <label for="task-title-input">
                        Task Title
                    </label>

                    <input type="text" id="task-title-input" placeholder="Enter Task Title" required>

                </div>
                <div class="form-field">

                    <label for="task-desc-input">
                        Description
                    </label>

                    <textarea id="task-desc-input" rows="3"
                        placeholder="Enter Description (Enter + Shift to Save)"></textarea>

                </div>
                <div class="form-btn">

                    <button type="submit" id="save-task-btn">
                        Save
                    </button>

                    <button type="button" id="cancel-task-btn">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Edit Task form  -->
    <div id="edit-modal" class="modal">

        <div class="modal-content">

            <h2>Edit Task</h2>

            <div class="edit-scroll-container">

                <!-- Clear All -- Added Dynamically -->

                <ul class="edit-task-list">

                    <!-- Empty Message Dynamically Rendered Here if No Tasks Available for Edit  -->

                    <!-- Taks rendered here dynamically using JS -->

                </ul>

            </div>

            <div class="form-btn">

                <button id="cancel-edit-btn">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    </div>
    <script src="/script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>

</html>
