<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header class="header" id="header">

        <div class="header_div_container">

            <!-- Nav Buttons  -->
            <div class="cpp_container">

                <a href="#goals">Goals</a>
                <a href="#productivity">Productivity</a>
                <a href="#progress">Progress</a>

            </div>

            <!-- Title Badge  -->
            <div class="title_container">

                <h1>
                    <span>Track-</span><span>You-</span><span>Up</span>
                </h1>

            </div>

            <!-- Logina & Theme buttons -->
            <div class="login_container">

                <button id="theme-toggle">
                    <i data-lucide="moon"></i>
                </button>

                <button>
                    Login
                </button>

            </div>

        </div>

    </header>

    <main>

        <div class="main-container">

            <!-- Goals Card  -->
            <div class="goals">

                <h2>Today's Goals</h2>

                <ul class="task-list">

                    <p id="empty-msg">
                        No Goal Added Yet - Click "Add Task" to Add
                    </p>

                </ul>

                <div class="task-controls">

                    <button id="add-task-btn">
                        <i data-lucide="plus"></i>
                        Add Task
                    </button>

                    <button id="edit-task-mode-btn">
                        <i data-lucide="pen-line"></i>
                        Edit
                    </button>

                </div>

            </div>

            <div class="productivity">
                <h2>Productivity - Today</h2>

            </div>

            <div class="progress">
                <h2>Progress Over Time</h2>
            </div>

        </div>

    </main>

    <!-- Add Task Form  -->
    <div id="task-modal" class="modal">

        <div class="modal-content">

            <h2>Add New Goal</h2>

            <form id="task-form">
                <div class="form-field">

                    <label for="task-title-input">
                        Task Title
                    </label>

                    <input type="text" id="task-title-input" placeholder="Enter Task Title" required>

                </div>
                <div class="form-field">

                    <label for="task-desc-input">
                        Description
                    </label>

                    <textarea id="task-desc-input" rows="3"
                        placeholder="Enter Description (Ctrl + Enter to Save)"></textarea>

                </div>
                <div class="form-btn">

                    <button type="submit" id="save-task-btn">
                        Save
                    </button>

                    <button type="button" id="cancel-task-btn">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Edit Task form  -->
    <div id="edit-modal" class="modal">

        <div class="modal-content">

            <h2>Edit Task</h2>

            <!-- Clear All -->
            <div class="edit-header">

                <button class="clear-all">
                    <i data-lucide="trash"></i>
                </button>

            </div>

            <ul class="edit-task-list">

                <p2 class="edit-empty-msg">
                    No Task Available to Edit
                </p2>
                <!-- Taks rendered here dynamically using JS -->
                <!-- Sample Task Item -->
                <li class="edit-task-items">

                    <span class="edit-task-title">
                        <i data-lucide="dot"></i>
                        Study DSA
                    </span>

                    <div class="edit-actions">

                        <button class="edit-task-btn">
                            <i data-lucide="pen"></i>
                        </button>

                        <button class="clear-task-btn">
                            <i data-lucide="trash"></i>
                        </button>

                    </div>
                </li>
                <li class="edit-task-items">

                    <span class="edit-task-title">
                        <i data-lucide="dot"></i>
                        Study DSA
                    </span>

                    <div class="edit-actions">

                        <button class="edit-task-btn">
                            <i data-lucide="pen"></i>
                        </button>

                        <button class="clear-task-btn">
                            <i data-lucide="trash"></i>
                        </button>

                    </div>
                </li>

            </ul>

            <div class="form-btn">

                <button id="cancel-edit-btn">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    </div>
    <script src="/script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>

</html>
