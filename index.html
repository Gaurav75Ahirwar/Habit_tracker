<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header class="header" id="header">

        <div class="header_div_container">

            <!-- Nav Buttons  -->
            <div class="cpp_container">

                <a href="#goals">Goals</a>
                <a href="#productivity">Productivity</a>
                <a href="#progress">Progress</a>

            </div>

            <!-- Title Badge  -->
            <div class="title_container">

                <h1>
                    <span>Track-</span><span>You-</span><span>Up</span>
                </h1>

            </div>

            <!-- Logina & Theme buttons -->
            <div class="login_container">

                <button id="theme-toggle" title="Dark Mode">
                    <i data-lucide="moon"></i>
                </button>

                <button>
                    Login
                </button>

            </div>

        </div>

    </header>

    <main>

        <div class="main-container">

            <!-- Goals Card  -->
            <div class="goals">

                <h2>Today's Goals</h2>

                <p id="empty-msg" class="empty-msg">
                    No Goal Added Yet - Click "Add Task" to Add
                </p>

                <ul class="task-list">

                    <!-- Tasks will be rendered here dynamically using JS -->

                </ul>

                <div class="task-controls">

                    <button id="add-task-btn">
                        <i data-lucide="plus"></i>
                        Add Task
                    </button>

                    <button id="edit-task-mode-btn">
                        <i data-lucide="pen-line"></i>
                        Edit
                    </button>

                </div>

            </div>

            <div class="productivity">

                <h2>Productivity - Today</h2>

                <!-- Progress Ring -->
                <div class="progress-ring-container">

                    <svg class="progress-ring" width="160" height="160">

                        <!-- Track  -->
                        <circle class="ring-track" cx="80" cy="80" r="70"></circle>
                        <circle class="ring-progress" cx="80" cy="80" r="70"></circle>

                    </svg>

                    <!-- Percentage Text -->
                    <div class="progress-percentage">

                        <span id="productivity-percentage">
                            0
                            <i data-lucide="percent"></i>
                        </span>

                    </div>

                </div>

                <!-- Task Statistics -->
                <div class="task-stats">

                    <div class="stat-iten">

                        <span class="stat-number" id="completed-count">
                            0
                        </span>

                        <span class="stat-label">
                            Completed
                        </span>

                    </div>

                    <div class="stat-divider">
                        /
                    </div>

                    <div class="stat-item">

                        <span class="stat-number" id="remaining-count">
                            0
                        </span>

                        <span class="stat-label">
                            Remaining
                        </span>

                    </div>

                </div>

                <!-- Time-of-Day Bar -->
                <div class="time-bar-section">

                    <div class="time-bar-label">

                        Daily Activity

                    </div>

                    <div class="time-bar" id="time-bar">

                        <!-- Time Segments  -->
                        <div class="time-segment night"></div>
                        <div class="time-segment morning"></div>
                        <div class="time-segment afternoon"></div>
                        <div class="time-segment evening"></div>

                        <!-- Markers will be added dynamically -->

                        <!-- Sample -->
                        <div class="time-marker" style="left: 56%;" title="1:40 PM"></div>
                    </div>

                    <div class="time-labels">

                        <span>00</span>
                        <span>06</span>
                        <span>12</span>
                        <span>18</span>
                        <span>24</span>

                    </div>
                </div>

                <!-- Status & Quote -->
                <div class="productivity-footer">

                    <div class="productivity-status" id="productivity-status">

                        Status: Starting
                    </div>

                </div>

                <div class="productivity-quote" id="productivity-quote">

                    Stay Consistent, Stay Producive!

                </div>

            </div>

            <div class="progress">
                <h2>Progress Over Time</h2>
            </div>

        </div>

    </main>

    <!-- Add Task Form  -->
    <div id="task-modal" class="modal">

        <div class="modal-content">

            <h2>Add New Goal</h2>

            <form id="task-form">
                <div class="form-field">

                    <label for="task-title-input">
                        Task Title
                    </label>

                    <input type="text" id="task-title-input" placeholder="Enter Task Title" required>

                </div>
                <div class="form-field">

                    <label for="task-desc-input">
                        Description
                    </label>

                    <textarea id="task-desc-input" rows="3"
                        placeholder="Enter Description (Enter + Shift to Save)"></textarea>

                </div>
                <div class="form-btn">

                    <button type="submit" id="save-task-btn">
                        Save
                    </button>

                    <button type="button" id="cancel-task-btn">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Edit Task form  -->
    <div id="edit-modal" class="modal">

        <div class="modal-content">

            <h2>Edit Task</h2>

            <div class="edit-scroll-container">

                <!-- Clear All -- Added Dynamically -->

                <ul class="edit-task-list">

                    <!-- Empty Message Dynamically Rendered Here if No Tasks Available for Edit  -->

                    <!-- Taks rendered here dynamically using JS -->

                </ul>

            </div>

            <div class="form-btn">

                <button id="cancel-edit-btn">
                    Cancel
                </button>

            </div>

        </div>

    </div>

    </div>
    <script src="/script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>

</html>
